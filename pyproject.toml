[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-image-accel"
version = "0.1.0"
description = "Accelerated Qwen-Image-2.1 image generation and editing on RTX 5090 with BF16 Triton kernels and optional MXFP8"
keywords = ["qwen-image", "image-generation", "image-editing", "inference-optimization", "rtx-5090", "triton", "mxfp8", "sageattention"]
readme = "README.md"
requires-python = ">=3.10"
license = "CPAL-1.0"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]
authors = [{name = "Devin Lai"}]
dependencies = [
    "torch>=2.1",
    "diffusers==0.41.0.dev0",
    "accelerate==1.15.0",
    "transformers==5.17.0",
    "Pillow==12.2.0",
    "numpy>=1.24",
]

[project.scripts]
qwen-image-accel = "qwen_image_accel.cli:main"

[project.urls]
Homepage = "https://github.com/devin-lai/Qwen-Image-2.1-Accel"
Repository = "https://github.com/devin-lai/Qwen-Image-2.1-Accel"
Documentation = "https://github.com/devin-lai/Qwen-Image-2.1-Accel/blob/main/docs/installation.md"
Issues = "https://github.com/devin-lai/Qwen-Image-2.1-Accel/issues"
Benchmarks = "https://github.com/devin-lai/Qwen-Image-2.1-Accel/blob/main/docs/benchmarks/README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
